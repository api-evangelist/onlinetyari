name: OnlineTyari
description: >-
  OnlineTyari is one of India's largest online exam-preparation platforms, built
  by Next Door Learning Solutions Private Limited (Jaipur, Rajasthan) and acquired
  by Embibe in February 2020. Through its website and Android/iOS apps it helps
  students and job aspirants prepare for competitive government examinations such
  as SSC CGL, IBPS PO/Clerk, RRB, Railways NTPC, and various State PSC exams,
  offering mock tests, question banks, current-affairs updates, e-books, and study
  material in Hindi and English produced with independent tutors, coaching
  institutes, and subject authors. It was added to the API Evangelist network as a
  portfolio company of 500 Global. As of this enrichment pass, OnlineTyari operates
  as a consumer-facing exam-prep product and publishes no public developer API,
  OpenAPI specification, or developer portal.
